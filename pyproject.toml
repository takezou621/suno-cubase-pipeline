[project]
name = "suno-cubase-pipeline"
version = "0.1.0"
description = "Suno音源を6ステムに分離し、Cubase用のAAFプロジェクトを生成するCLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyaaf2>=1.7",
    "soundfile>=0.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
# 分離 (demucs) と BPM 推定 (librosa)。Core だけなら AAF 生成まで動く
separate = [
    "demucs>=4.0.1",
    "librosa>=0.10",
]
dev = ["pytest"]

[project.scripts]
suno2cubase = "suno_cubase.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
